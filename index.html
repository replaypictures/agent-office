<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ReplayPictures AI Agent Office 🏢 (2.5D Toon & Dot Graphic)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'DungGeunMo';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg-cream: #F5EFE6;
      --bg-dark: #101413;
      --text-main: #1A202C;
      --text-muted: #4A5568;
      --accent-teal: #1F7A6E;
      --accent-mustard: #D9A036;
      --accent-orange: #D95338;
      --accent-green: #386641;
      --wood: #783E2D;
      --panel-bg: rgba(255, 255, 255, 0.94);
      --panel-border: #1A1A1A;
      --pixel-shadow: 4px 4px 0px #1A1A1A;
      --pixel-shadow-sm: 2px 2px 0px #1A1A1A;
    }

    body.dark {
      --bg-cream: #101413;
      --text-main: #F7FAFC;
      --text-muted: #CBD5E0;
      --panel-bg: rgba(20, 26, 24, 0.95);
      --panel-border: #000000;
      --pixel-shadow: 4px 4px 0px #000000;
      --pixel-shadow-sm: 2px 2px 0px #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'DungGeunMo', 'Pretendard', sans-serif;
      transition: background-color 0.3s ease;
    }

    /* Hardware Pixel Art Rendering on 3D Canvas */
    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      display: block;
      z-index: 1;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    /* Retro CRT Scanline & Dot Matrix Overlay */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.16) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
      z-index: 5;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }

    .scanlines.off {
      opacity: 0;
    }

    /* Retro 8-bit Pixel Header UI */
    header {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .header-box {
      background: var(--panel-bg);
      border: 3px solid var(--panel-border);
      box-shadow: var(--pixel-shadow);
      padding: 10px 18px;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      font-size: 24px;
      animation: floatBadge 2s ease-in-out infinite alternate;
    }

    @keyframes floatBadge {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag-live {
      font-family: 'DungGeunMo', monospace;
      font-size: 11px;
      font-weight: normal;
      background: #E76F51;
      color: #FFF;
      padding: 3px 6px;
      border: 2px solid #1A1A1A;
      box-shadow: 2px 2px 0px #1A1A1A;
      letter-spacing: 0px;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav-controls {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .btn-pixel {
      background: var(--panel-bg);
      border: 3px solid var(--panel-border);
      box-shadow: var(--pixel-shadow);
      color: var(--text-main);
      padding: 8px 14px;
      cursor: pointer;
      font-family: 'DungGeunMo', sans-serif;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.1s;
    }

    .btn-pixel:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px var(--panel-border);
      background: #FFF;
    }

    .btn-pixel:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--panel-border);
    }

    /* Bottom Character Roster Bar */
    .roster-bar {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      background: var(--panel-bg);
      border: 3px solid var(--panel-border);
      box-shadow: var(--pixel-shadow);
      padding: 8px 14px;
      pointer-events: auto;
      max-width: 95vw;
      overflow-x: auto;
    }

    .agent-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border: 2px solid transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
      transition: all 0.15s;
    }

    .agent-pill:hover {
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.05);
    }

    .agent-pill.active {
      color: #FFF;
      background: var(--accent-teal);
      border: 2px solid #1A1A1A;
      box-shadow: var(--pixel-shadow-sm);
    }

    .agent-pill.pickle.active { background: #2D6A4F; }
    .agent-pill.muse.active { background: #D90429; }
    .agent-pill.genspark.active { background: #D9A036; color: #1A1A1A; }
    .agent-pill.chatgpt.active { background: #2B2D42; }

    /* Pixel Speech Bubble */
    .speech-bubble {
      position: fixed;
      z-index: 15;
      background: #FFF;
      color: #1A1A1A;
      border: 3px solid #1A1A1A;
      box-shadow: var(--pixel-shadow);
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      transform: translate(-50%, -100%) translateY(-24px);
      max-width: 320px;
      line-height: 1.45;
      opacity: 0;
      transition: opacity 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.2s ease;
      white-space: normal;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #1A1A1A;
    }

    .speech-bubble.visible {
      opacity: 1;
      transform: translate(-50%, -100%) translateY(-28px);
    }

    /* Agent Detail Side Card (8-bit RPG Style) */
    .detail-card {
      position: fixed;
      top: 86px;
      right: 18px;
      width: 330px;
      max-width: calc(100vw - 36px);
      background: var(--panel-bg);
      border: 3px solid var(--panel-border);
      box-shadow: var(--pixel-shadow);
      padding: 18px;
      z-index: 10;
      pointer-events: auto;
      transform: translateX(380px);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .detail-card.open {
      transform: translateX(0);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--panel-border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-close {
      background: #E76F51;
      color: #FFF;
      border: 2px solid #1A1A1A;
      box-shadow: 2px 2px 0px #1A1A1A;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .card-status {
      display: inline-block;
      font-size: 11px;
      padding: 3px 8px;
      background: #52B788;
      color: #FFF;
      border: 2px solid #1A1A1A;
      box-shadow: 2px 2px 0px #1A1A1A;
      margin-bottom: 12px;
    }

    .card-desc {
      font-family: 'Pretendard', sans-serif;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .card-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field-value {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.04);
      padding: 6px 10px;
      border-left: 3px solid var(--accent-teal);
    }

    /* Help & Guide Hint */
    .interaction-hint {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      background: rgba(26, 26, 26, 0.88);
      color: #FFF;
      border: 2px solid #FFF;
      box-shadow: var(--pixel-shadow-sm);
      padding: 7px 16px;
      font-size: 12px;
      pointer-events: none;
      transition: opacity 0.5s ease;
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .header-box { padding: 8px 12px; }
      .brand-title { font-size: 14px; }
      .brand-sub { display: none; }
      .roster-bar { bottom: 10px; padding: 6px 8px; gap: 6px; }
      .agent-pill { padding: 5px 8px; font-size: 12px; }
      .detail-card { width: calc(100vw - 24px); right: 12px; top: 76px; }
      .btn-pixel { padding: 6px 10px; font-size: 12px; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>
  <!-- Retro CRT Scanline & Dot Matrix Texture -->
  <div class="scanlines" id="scanlines"></div>

  <!-- Top Retro Bar -->
  <header>
    <div class="header-box">
      <div class="logo-badge">👾</div>
      <div>
        <div class="brand-title">
          ReplayPictures AI Office
          <span class="tag-live">2.5D TOON</span>
        </div>
        <div class="brand-sub">도트 그래픽 & 카툰 셀 셰이딩 실시간 작업실</div>
      </div>
    </div>

    <div class="nav-controls">
      <button id="btn-pixel" class="btn-pixel" title="도트 크기 변경">👾 도트: 3.5x</button>
      <button id="btn-crt" class="btn-pixel" title="CRT 스캔라인 켜기/끄기">📺 CRT</button>
      <button id="btn-reset" class="btn-pixel" title="카메라 위치 초기화">🏠 리셋</button>
      <button id="btn-theme" class="btn-pixel" title="라이트/다크 모드">🌙</button>
    </div>
  </header>

  <!-- Speech Bubble (2D Screen Follower) -->
  <div id="speech-bubble" class="speech-bubble">피클 대사 출력</div>

  <!-- Agent Side Detail Card -->
  <div id="detail-card" class="detail-card">
    <div class="card-header">
      <div class="card-title">
        <span id="card-avatar">🤖</span>
        <span id="card-name">피클</span>
      </div>
      <button class="card-close" id="btn-close-card">&times;</button>
    </div>
    <div class="card-status" id="card-status">작업 준비 중</div>
    <div class="card-desc" id="card-desc">에이전트 상세 설명</div>
    <div class="card-field">
      <span class="field-label">담당 역할</span>
      <span class="field-value" id="card-role">비주얼 연출</span>
    </div>
    <div class="card-field">
      <span class="field-label">대표 소품 & 기믹</span>
      <span class="field-value" id="card-prop">믹스커피 & 새싹</span>
    </div>
    <div class="card-field">
      <span class="field-label">최근 발언</span>
      <span class="field-value" id="card-action">상태 메시지</span>
    </div>
  </div>

  <!-- Interactive Hint -->
  <div class="interaction-hint" id="hint">
    🎮 화면을 드래그해 360° 회전하고, 캐릭터를 터치해 말을 걸어보세요!
  </div>

  <!-- Bottom Quick Roster -->
  <div class="roster-bar">
    <div class="agent-pill pickle active" data-agent="pickle">🥒 피클 (Visual)</div>
    <div class="agent-pill muse" data-agent="muse">🧚‍♀️ 뮤즈 (Story)</div>
    <div class="agent-pill genspark" data-agent="genspark">⚡ 젠스파크 (Data)</div>
    <div class="agent-pill chatgpt" data-agent="chatgpt">🤖 ChatGPT (Server)</div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script>
    // --- Data Definition ---
    const AGENTS = {
      pickle: {
        name: '피클 (Pickle)',
        role: '비주얼 연출 & 파이프라인 총괄',
        avatar: '🥒',
        status: '2.5D 도트 카툰 렌더링 배포 가동 🚀',
        pos: { x: -3.5, y: 1.1, z: 2 },
        color: 0x52B788,
        quote: "사장님 피드백 반영 완료! 2.5D 카툰 렌더링에 도트 그래픽 질감까지 얹었습니다 ㅎㅎ 👾",
        prop: '초록 후드 + 맥심 믹스커피 + 레드불',
        desc: '비주얼 작화 렌더링, 100% 한글 자막 타이포그래피, 세로 스크롤 합본 제작 및 Three.js 2.5D 웹 엔진을 담당합니다.'
      },
      muse: {
        name: '뮤즈 (Muse)',
        role: '시나리오 기획 & 톤앤매너 조율',
        avatar: '🧚‍♀️',
        status: '도트 그래픽 캐릭터성 합의 완료 ✨',
        pos: { x: -3.5, y: 1.1, z: -2 },
        color: 0xFF4D6D,
        quote: "도트 그래픽으로 바꾸니까 훨씬 키치하고 귀엽네요! 2.5D 카툰 무드 합격입니다 💕",
        prop: '분홍 요정 날개 + 드로잉 태블릿',
        desc: '에피소드 대사 톤앤매너, 다크 코미디 시나리오 구성 및 비주얼 콘셉트 설계를 담당합니다.'
      },
      genspark: {
        name: '젠스파크 (Genspark)',
        role: '레퍼런스 리서치 & 품질 검증',
        avatar: '⚡',
        status: '도트 픽셀 해상도 검증 완료 📊',
        pos: { x: 3.5, y: 1.1, z: -2 },
        color: 0x2A9D8F,
        quote: "픽셀 아트 렌더링 파라미터 최적화 완료! 좁은 모바일 화면에서도 선명한 도트 표현 검증되었습니다 📐",
        prop: '트리플 모니터 + 브라스 램프',
        desc: '레퍼런스 데이터 아카이빙, 프롬프트 교차 검증 및 좁은 화면 UI 규칙 정립을 지원합니다.'
      },
      chatgpt: {
        name: 'ChatGPT',
        role: '서버 인프라 & 코드 검토',
        avatar: '🤖',
        status: 'GitHub Pages 배포 안정화 ⚙️',
        pos: { x: 3.5, y: 1.1, z: 2 },
        color: 0x4A5568,
        quote: "Three.js 2.5D 셀 셰이더와 픽셀레이션 버퍼 정상 구동 확인. 60FPS 방어 중입니다 🕹️",
        prop: '서버 랙 + 안테나',
        desc: '백엔드 스크립트 무결점 검토, 인프라 상태 모니터링 및 코드 최적화를 보조합니다.'
      }
    };

    // --- Three.js Setup ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xF5EFE6);

    // 2.5D Isometric Style Perspective Camera
    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(16, 14, 18);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.BasicShadowMap; // Hard shadows fit pixel art perfectly!

    // --- 2.5D Dot Graphic Pixelation Logic ---
    let pixelScale = 3.5; // Default: 3.5x chunky retro pixels
    function updateRendererSize() {
      const w = Math.max(1, Math.floor(window.innerWidth / pixelScale));
      const h = Math.max(1, Math.floor(window.innerHeight / pixelScale));
      renderer.setSize(w, h, false);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    updateRendererSize();

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI / 2.15;
    controls.minDistance = 8;
    controls.maxDistance = 32;
    controls.target.set(0, 1, 0);

    // --- 2.5D Toon Cel-Shading Stepped Gradient Map ---
    function createToonGradient() {
      const gCanvas = document.createElement('canvas');
      gCanvas.width = 4;
      gCanvas.height = 1;
      const ctx = gCanvas.getContext('2d');
      // 4-step discrete comic lighting bands
      ctx.fillStyle = '#333333'; ctx.fillRect(0, 0, 1, 1);
      ctx.fillStyle = '#777777'; ctx.fillRect(1, 0, 1, 1);
      ctx.fillStyle = '#BBBBBB'; ctx.fillRect(2, 0, 1, 1);
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(3, 0, 1, 1);
      const tex = new THREE.CanvasTexture(gCanvas);
      tex.minFilter = THREE.NearestFilter;
      tex.magFilter = THREE.NearestFilter;
      return tex;
    }
    const toonGradient = createToonGradient();

    // Helper to create 2.5D Toon Materials
    function createToon(color, opts = {}) {
      return new THREE.MeshToonMaterial({
        color: color,
        gradientMap: toonGradient,
        ...opts
      });
    }

    // Helper to add Cartoon Inverted Outlines (Cel-shading contour)
    function addOutline(mesh, thickness = 0.045, color = 0x111111) {
      const outlineMat = new THREE.MeshBasicMaterial({ color, side: THREE.BackSide });
      const outlineMesh = new THREE.Mesh(mesh.geometry, outlineMat);
      outlineMesh.scale.multiplyScalar(1 + thickness);
      mesh.add(outlineMesh);
      return outlineMesh;
    }

    // --- Lighting (Clean Cartoon Lighting) ---
    const ambientLight = new THREE.AmbientLight(0xFFF9F0, 0.75);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xFFF0D4, 1.35);
    sunLight.position.set(14, 20, 12);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 40;
    sunLight.shadow.camera.left = -12;
    sunLight.shadow.camera.right = 12;
    sunLight.shadow.camera.top = 12;
    sunLight.shadow.camera.bottom = -12;
    sunLight.shadow.bias = -0.001;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0xCCE3DE, 0.45);
    fillLight.position.set(-15, 8, -10);
    scene.add(fillLight);

    // --- Room Construction (Toon & Dot Palette) ---
    const roomGroup = new THREE.Group();
    scene.add(roomGroup);

    // Floor: Warm Wood Planks with Toon Shading
    const floorGeo = new THREE.BoxGeometry(14, 0.5, 12);
    const floorMat = createToon(0xA26744);
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.y = -0.25;
    floor.receiveShadow = true;
    addOutline(floor, 0.015, 0x2B1A12);
    roomGroup.add(floor);

    // Walls: Mid-century Cream & Teal
    const wallMatCream = createToon(0xEDE6D6);
    const wallMatTeal = createToon(0x2A9D8F);

    // Back Wall
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(14, 6, 0.4), wallMatCream);
    backWall.position.set(0, 2.75, -6.2);
    backWall.receiveShadow = true;
    addOutline(backWall, 0.015, 0x1A1A1A);
    roomGroup.add(backWall);

    // Left Wall
    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 6, 12), wallMatCream);
    leftWall.position.set(-7.2, 2.75, 0);
    leftWall.receiveShadow = true;
    addOutline(leftWall, 0.015, 0x1A1A1A);
    roomGroup.add(leftWall);

    // Teal Accent Wall Panel
    const accentPanel = new THREE.Mesh(new THREE.BoxGeometry(6, 4.5, 0.2), wallMatTeal);
    accentPanel.position.set(0, 2.5, -5.9);
    accentPanel.receiveShadow = true;
    addOutline(accentPanel, 0.02, 0x14453D);
    roomGroup.add(accentPanel);

    // Window with Tinted Glass
    const winFrameMat = createToon(0x1F2421);
    const winGlassMat = createToon(0xCBE3DB, { transparent: true, opacity: 0.7 });
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4, 6), winGlassMat);
    win.position.set(-7.05, 2.8, -1.5);
    roomGroup.add(win);

    // Mustard Carpet
    const carpetMat = createToon(0xE9C46A);
    const carpet = new THREE.Mesh(new THREE.BoxGeometry(8, 0.05, 7), carpetMat);
    carpet.position.set(0, 0.02, 0);
    carpet.receiveShadow = true;
    addOutline(carpet, 0.02, 0x735515);
    roomGroup.add(carpet);

    // --- Furniture Generator (Toon Cel-Shaded) ---
    const deskWoodMat = createToon(0xBD7E58);
    const metalLegMat = createToon(0x2B2D42);

    function createDesk(x, z, rotateY = 0) {
      const deskGroup = new THREE.Group();
      // Desk Top
      const top = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.16, 1.8), deskWoodMat);
      top.position.y = 1.3;
      top.castShadow = true;
      top.receiveShadow = true;
      addOutline(top, 0.025, 0x1A1A1A);
      deskGroup.add(top);

      // Legs
      const legGeo = new THREE.CylinderGeometry(0.06, 0.04, 1.3, 8);
      const positions = [[-1.4, -0.7], [1.4, -0.7], [-1.4, 0.7], [1.4, 0.7]];
      positions.forEach(([lx, lz]) => {
        const leg = new THREE.Mesh(legGeo, metalLegMat);
        leg.position.set(lx, 0.65, lz);
        leg.castShadow = true;
        deskGroup.add(leg);
      });

      deskGroup.position.set(x, 0, z);
      deskGroup.rotation.y = rotateY;
      roomGroup.add(deskGroup);
      return deskGroup;
    }

    createDesk(-4, 2, Math.PI / 2);   // Pickle
    createDesk(-4, -2, Math.PI / 2);  // Muse
    createDesk(4, -2, -Math.PI / 2);  // Genspark
    createDesk(4, 2, -Math.PI / 2);   // ChatGPT

    // Lounge Area: Avocado Green Sofa
    const sofaMat = createToon(0x52796F);
    const sofa = new THREE.Group();
    const seat = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.6, 1.4), sofaMat);
    seat.position.y = 0.5;
    seat.castShadow = true;
    addOutline(seat, 0.03, 0x1E332D);
    sofa.add(seat);
    const back = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.2, 0.4), sofaMat);
    back.position.set(0, 1.1, -0.5);
    back.castShadow = true;
    addOutline(back, 0.03, 0x1E332D);
    sofa.add(back);
    sofa.position.set(0, 0, -4.8);
    roomGroup.add(sofa);

    // Coffee Table
    const coffeeTable = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.45, 16), deskWoodMat);
    coffeeTable.position.set(0, 0.22, -3.2);
    coffeeTable.castShadow = true;
    addOutline(coffeeTable, 0.03, 0x1A1A1A);
    roomGroup.add(coffeeTable);

    // --- Interactive 2.5D Toon Characters ---
    const agentMeshes = {};
    const raycastTargets = [];

    function createAgentFigure(key, agent) {
      const group = new THREE.Group();
      group.userData = { key, agent };

      // Chibi Cartoon Body with Black Contour Outline
      const bodyGeo = new THREE.SphereGeometry(0.56, 18, 18);
      const bodyMat = createToon(agent.color);
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.6;
      body.castShadow = true;
      addOutline(body, 0.065, 0x111111);
      group.add(body);

      // 2.5D Pixel Cute Eyes
      const eyeGeo = new THREE.BoxGeometry(0.12, 0.16, 0.05);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(0.18, 0.72, 0.52);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(-0.18, 0.72, 0.52);
      group.add(leftEye);
      group.add(rightEye);

      // Character-specific signature accessories (Cartoon Stepped)
      if (key === 'pickle') {
        // Sprout Stem & Leaf
        const sproutStem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.25, 8), createToon(0x1B4332));
        sproutStem.position.set(0, 1.25, 0);
        addOutline(sproutStem, 0.08, 0x081C15);
        group.add(sproutStem);
        const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), createToon(0x74C69D));
        leaf.scale.set(1.5, 0.4, 0.8);
        leaf.position.set(0.1, 1.35, 0);
        leaf.rotation.z = 0.35;
        addOutline(leaf, 0.08, 0x081C15);
        group.add(leaf);

        // Yellow Maxim Coffee Mug
        const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.28, 12), createToon(0xE9C46A));
        mug.position.set(-0.6, 0.25, 0.5);
        mug.castShadow = true;
        addOutline(mug, 0.06, 0x111111);
        group.add(mug);

        // Blue Energy Drink Can
        const can = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.24, 12), createToon(0x1D3557));
        can.position.set(-0.85, 0.23, 0.45);
        can.castShadow = true;
        addOutline(can, 0.06, 0x111111);
        group.add(can);
      } else if (key === 'muse') {
        // Fairy Wings with Outline
        const wingMat = createToon(0xFF758F, { transparent: true, opacity: 0.85 });
        const leftWing = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 12), wingMat);
        leftWing.scale.set(1.2, 0.6, 0.1);
        leftWing.position.set(0.45, 0.8, -0.4);
        leftWing.rotation.set(0.3, 0.4, 0.2);
        addOutline(leftWing, 0.06, 0xA4133C);
        const rightWing = leftWing.clone();
        rightWing.position.set(-0.45, 0.8, -0.4);
        rightWing.rotation.set(0.3, -0.4, -0.2);
        group.add(leftWing);
        group.add(rightWing);

        // Golden Tiara
        const tiara = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.05, 6, 16), createToon(0xFFD166));
        tiara.rotation.x = Math.PI / 2;
        tiara.position.set(0, 1.08, 0);
        addOutline(tiara, 0.06, 0x735515);
        group.add(tiara);

        // Drawing Tablet
        const tablet = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.04, 0.38), createToon(0x222222));
        tablet.position.set(-0.5, 0.2, 0.5);
        tablet.rotation.y = 0.2;
        addOutline(tablet, 0.06, 0x111111);
        group.add(tablet);

        // Cyan Focal Point Light
        const tabletLight = new THREE.PointLight(0x70D6FF, 1.0, 2.5);
        tabletLight.position.set(-0.5, 0.5, 0.5);
        group.add(tabletLight);
      } else if (key === 'genspark') {
        // Lightning Badge
        const badge = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.38, 3), createToon(0xFFD166));
        badge.position.set(0, 1.28, 0);
        addOutline(badge, 0.08, 0x735515);
        group.add(badge);

        // Brass Desk Lamp
        const lampMat = createToon(0xE9C46A);
        const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.05, 12), lampMat);
        lampBase.position.set(0.6, 0.2, -0.6);
        addOutline(lampBase, 0.08, 0x111111);
        group.add(lampBase);
        const lampArm = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.5), lampMat);
        lampArm.position.set(0.6, 0.45, -0.6);
        lampArm.rotation.z = -0.2;
        group.add(lampArm);
        const lampShade = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.22, 12, 1, true), lampMat);
        lampShade.position.set(0.5, 0.65, -0.6);
        lampShade.rotation.z = 0.5;
        addOutline(lampShade, 0.08, 0x111111);
        group.add(lampShade);

        const brassLight = new THREE.PointLight(0xFFD166, 1.2, 3.0);
        brassLight.position.set(0.5, 0.6, -0.6);
        group.add(brassLight);

        // Triple Monitor Array
        const monMat = createToon(0x1E293B);
        const m1 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.06), monMat);
        m1.position.set(0.8, 0.35, 0);
        m1.rotation.y = -Math.PI / 2;
        addOutline(m1, 0.05, 0x0F172A);
        const m2 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.06), monMat);
        m2.position.set(0.8, 0.35, 0.7);
        m2.rotation.y = -Math.PI / 2 + 0.3;
        addOutline(m2, 0.05, 0x0F172A);
        group.add(m1);
        group.add(m2);
      } else if (key === 'chatgpt') {
        // Antenna
        const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.45), metalLegMat);
        ant.position.set(0, 1.3, 0);
        group.add(ant);
        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.08), createToon(0x10B981));
        ball.position.set(0, 1.55, 0);
        addOutline(ball, 0.1, 0x064E3B);
        group.add(ball);
      }

      // Name Label Plate
      const labelPlate = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 0.05), createToon(0x111111));
      labelPlate.position.set(0, 0.05, 0.55);
      group.add(labelPlate);

      group.position.set(agent.pos.x, agent.pos.y, agent.pos.z);
      scene.add(group);
      agentMeshes[key] = group;
      raycastTargets.push(body);

      return group;
    }

    Object.keys(AGENTS).forEach(key => createAgentFigure(key, AGENTS[key]));

    // --- Interactive Selection & Speech Bubble ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const bubbleEl = document.getElementById('speech-bubble');
    const cardEl = document.getElementById('detail-card');

    function showAgent(key) {
      const agent = AGENTS[key];
      const mesh = agentMeshes[key];
      if (!agent || !mesh) return;

      document.querySelectorAll('.agent-pill').forEach(pill => {
        pill.classList.toggle('active', pill.dataset.agent === key);
      });

      bubbleEl.textContent = agent.quote;
      bubbleEl.classList.add('visible');

      document.getElementById('card-avatar').textContent = agent.avatar;
      document.getElementById('card-name').textContent = agent.name;
      document.getElementById('card-status').textContent = agent.status;
      document.getElementById('card-desc').textContent = agent.desc;
      document.getElementById('card-role').textContent = agent.role;
      document.getElementById('card-prop').textContent = agent.prop;
      document.getElementById('card-action').textContent = agent.quote;
      cardEl.classList.add('open');

      document.getElementById('hint').style.opacity = '0';

      // Camera Pan
      new TWEEN.Tween(controls.target)
        .to({ x: agent.pos.x, y: agent.pos.y + 0.5, z: agent.pos.z }, 600)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      // Bounce
      new TWEEN.Tween(mesh.position)
        .to({ y: agent.pos.y + 0.35 }, 180)
        .yoyo(true)
        .repeat(1)
        .easing(TWEEN.Easing.Quadratic.Out)
        .start();
    }

    function updateBubblePosition() {
      const activePill = document.querySelector('.agent-pill.active');
      if (!activePill || !bubbleEl.classList.contains('visible')) return;

      const key = activePill.dataset.agent;
      const mesh = agentMeshes[key];
      if (!mesh) return;

      const pos = new THREE.Vector3();
      mesh.getWorldPosition(pos);
      pos.y += 1.35;
      pos.project(camera);

      const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-(pos.y * 0.5) + 0.5) * window.innerHeight;

      bubbleEl.style.left = `${x}px`;
      bubbleEl.style.top = `${y}px`;
    }

    // Pointer Click
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('header') || e.target.closest('.roster-bar') || e.target.closest('.detail-card')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(raycastTargets);

      if (intersects.length > 0) {
        const clickedMesh = intersects[0].object;
        const parentGroup = clickedMesh.parent;
        if (parentGroup && parentGroup.userData.key) {
          showAgent(parentGroup.userData.key);
        }
      }
    });

    document.querySelectorAll('.agent-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        showAgent(pill.dataset.agent);
      });
    });

    document.getElementById('btn-close-card').addEventListener('click', () => {
      cardEl.classList.remove('open');
      bubbleEl.classList.remove('visible');
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      new TWEEN.Tween(camera.position).to({ x: 16, y: 14, z: 18 }, 700).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 1, z: 0 }, 700).easing(TWEEN.Easing.Cubic.Out).start();
      cardEl.classList.remove('open');
      bubbleEl.classList.remove('visible');
    });

    // Pixel Size Toggle (2x -> 3.5x -> 5x)
    const btnPixel = document.getElementById('btn-pixel');
    const pixelModes = [
      { scale: 2.0, label: '👾 도트: 2x (선명)' },
      { scale: 3.5, label: '👾 도트: 3.5x (표준)' },
      { scale: 5.0, label: '👾 도트: 5x (굵음)' }
    ];
    let pixelModeIdx = 1;

    btnPixel.addEventListener('click', () => {
      pixelModeIdx = (pixelModeIdx + 1) % pixelModes.length;
      pixelScale = pixelModes[pixelModeIdx].scale;
      btnPixel.textContent = pixelModes[pixelModeIdx].label;
      updateRendererSize();
    });

    // CRT Scanline Toggle
    const btnCrt = document.getElementById('btn-crt');
    const scanlines = document.getElementById('scanlines');
    let crtOn = true;
    btnCrt.addEventListener('click', () => {
      crtOn = !crtOn;
      scanlines.classList.toggle('off', !crtOn);
      btnCrt.style.background = crtOn ? 'var(--panel-bg)' : '#CBD5E0';
    });

    // Theme Toggle
    const btnTheme = document.getElementById('btn-theme');
    let isDark = false;
    btnTheme.addEventListener('click', () => {
      isDark = !isDark;
      document.body.classList.toggle('dark', isDark);
      btnTheme.textContent = isDark ? '☀️' : '🌙';

      const targetBg = isDark ? 0x101413 : 0xF5EFE6;
      const targetAmb = isDark ? 0x485550 : 0xFFF9F0;
      scene.background.setHex(targetBg);
      ambientLight.color.setHex(targetAmb);
      sunLight.intensity = isDark ? 0.6 : 1.35;
    });

    window.addEventListener('resize', updateRendererSize);

    setTimeout(() => {
      showAgent('pickle');
    }, 400);

    // Render Loop
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();

      const time = clock.getElapsedTime();
      Object.keys(agentMeshes).forEach((key, idx) => {
        const m = agentMeshes[key];
        m.children[0].scale.y = 1 + Math.sin(time * 2.5 + idx) * 0.03;
      });

      updateBubblePosition();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
