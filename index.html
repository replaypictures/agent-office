      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #14161d;
      font-family: 'Galmuri11', 'Galmuri9', monospace, sans-serif;
      color: #fff;

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: crosshair;
      touch-action: none;
    }

    canvas#office-canvas {
      position: absolute;
      top: 0;
      left: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 100;
      gap: 8px;
    }

    .brand-badge {
      pointer-events: auto;
      background: rgba(20, 22, 29, 0.92);
      border: 3px solid #f1c40f;
      box-shadow: 4px 4px 0 #000;
      padding: 6px 12px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge .icon {
      font-size: 1.2rem;
    }
    .brand-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #f1c40f;
      letter-spacing: -0.5px;
    }
    .brand-sub {
      font-size: 0.7rem;
      color: #a5b1c2;
    }

    .header-actions {
      pointer-events: auto;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .retro-btn {
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: bold;
      padding: 6px 10px;
      background: #2c3e50;
      color: #ecf0f1;
      border: 2px solid #000;
      box-shadow: 3px 3px 0 #000;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.1s;
    }
    .retro-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #000;
    }
    .retro-btn.primary {
      background: #e67e22;
      color: #fff;
    }
    .retro-btn.success {
      background: #27ae60;
      color: #fff;
    }
    .retro-btn.active {
      background: #f1c40f;
      color: #000;
    }

      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 100;
      gap: 8px;
    }

    .team-modes {
      pointer-events: auto;
      display: flex;
      gap: 6px;
      background: rgba(20, 22, 29, 0.92);
      border: 2px solid #000;
      box-shadow: 4px 4px 0 #000;
      padding: 6px;
      border-radius: 4px;
      overflow-x: auto;
      max-width: 100%;
    }

    .agent-selectors {
      pointer-events: auto;
      display: flex;
      gap: 6px;
      background: rgba(20, 22, 29, 0.92);
      border: 2px solid #000;
      box-shadow: 4px 4px 0 #000;
      padding: 6px;
      border-radius: 4px;
    }
    .agent-pill {
      font-family: inherit;
      font-size: 0.75rem;
      padding: 5px 8px;
      background: #34495e;
      color: #fff;
      border: 2px solid #000;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 2px 2px 0 #000;
    }
    .agent-pill:active {
      transform: translate(1px, 1px);

      right: 14px;

// 1. Audio Synthesizer (Web Audio API - 0 external files)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let soundEnabled = true;

function play8BitSound(type) {
  if (!soundEnabled) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'step') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(70, now + 0.05);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'click') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.setValueAtTime(659.25, now + 0.04); // E5
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'chime') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(659.25, now); // E5
      osc.frequency.setValueAtTime(830.61, now + 0.06); // G#5
      osc.frequency.setValueAtTime(1046.50, now + 0.12); // C6
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'fanfare') {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime(freq, now + idx * 0.07);
        g.gain.setValueAtTime(0.06, now + idx * 0.07);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.15);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(now + idx * 0.07);
        o.stop(now + idx * 0.07 + 0.15);
      });
    }
  } catch (e) {
    console.warn('Audio play failed', e);
  }
}

// Character Entity Class
class Entity {
  constructor(data, isPlayer = false) {
    this.id = data.id;
    this.name = data.name;
    this.tag = data.tag;
    this.color = data.color;
    this.badgeBg = data.badgeBg;
    this.isPlayer = isPlayer;
    this.x = data.homePos.x;
    this.y = data.homePos.y;
    this.targetX = this.x;
    this.targetY = this.y;
    this.speed = isPlayer ? 180 : 130; // px/sec
    this.facing = 1; // 1: right, -1: left
    this.isMoving = false;
    this.walkTimer = 0;
    this.idleTimer = Math.random() * 5;
    this.bubbleText = null;
    this.bubbleTimer = 0;
    this.bubbleDuration = 4.0;
  }

  moveTo(tx, ty) {
    this.targetX = Math.max(80, Math.min(MAP_WIDTH - 80, tx));
    this.targetY = Math.max(80, Math.min(MAP_HEIGHT - 80, ty));
    this.isMoving = true;
  }

  say(text, duration = 4.0) {
    this.bubbleText = text;
    this.bubbleTimer = duration;
    play8BitSound('chime');
  }

  update(dt) {
    if (this.bubbleTimer > 0) {
      this.bubbleTimer -= dt;
      if (this.bubbleTimer <= 0) this.bubbleText = null;
    }

    // Movement logic
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 4) {
      this.isMoving = true;
      this.facing = dx >= 0 ? 1 : -1;
      const step = Math.min(dist, this.speed * dt);
      this.x += (dx / dist) * step;
      this.y += (dy / dist) * step;
      this.walkTimer += dt * 8;

      if (this.isPlayer && Math.sin(this.walkTimer * 2) > 0.95) {
        play8BitSound('step');
      }
    } else {
      this.isMoving = false;
      this.x = this.targetX;
      this.y = this.targetY;
      this.walkTimer = 0;
      this.idleTimer += dt;

      // Periodic random speech for agents
      if (!this.isPlayer && this.bubbleText === null && Math.random() < 0.002) {
        const pool = AGENT_DATA[this.id].dialogues;
        if (pool && pool.length) {
          this.say(pool[Math.floor(Math.random() * pool.length)], 3.5);
        }
      }
    }
  }

  draw(ctx) {
    const img = spriteImages[this.id];
    if (!img || !img.complete) return;

    ctx.save();

    // Bobbing animation
    let bobY = 0;
    if (this.isMoving) {
      bobY = Math.abs(Math.sin(this.walkTimer)) * -6;
    } else {
      bobY = Math.sin(this.idleTimer * 2.5) * -2;
    }

    const drawX = Math.round(this.x);
    const drawY = Math.round(this.y + bobY);

    // Drop shadow under feet
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.beginPath();
    ctx.ellipse(drawX, drawY, 18, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Sprite drawing with horizontal flip
    ctx.translate(drawX, drawY);
    ctx.scale(this.facing, 1);
    ctx.drawImage(img, -img.width / 2, -img.height);
    ctx.restore();

    // Name badge above head
    this.drawBadge(ctx, drawX, drawY - img.height + bobY);

    // Speech bubble
    if (this.bubbleText) {
      this.drawSpeechBubble(ctx, drawX, drawY - img.height + bobY - 24, this.bubbleText);
    }
  }

  drawBadge(ctx, x, y) {
    ctx.save();
    ctx.font = 'bold 11px Galmuri11, monospace';
    const text = this.tag;
    const textWidth = ctx.measureText(text).width;
    const padX = 6;
    const h = 16;
    const w = textWidth + padX * 2;
    const bx = Math.round(x - w / 2);
    const by = Math.round(y - h - 4);

    // Black border & shadow
    ctx.fillStyle = '#000000';
    ctx.fillRect(bx - 1, by - 1, w + 2, h + 2);
    ctx.fillRect(bx + 2, by + 2, w, h);

    // Badge background
    ctx.fillStyle = this.badgeBg;
    ctx.fillRect(bx, by, w, h);

    // Badge text
    ctx.fillStyle = '#ffffff';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, bx + padX, by + h / 2 + 1);
    ctx.restore();
  }

  drawSpeechBubble(ctx, x, y, text) {
    ctx.save();
    ctx.font = '11px Galmuri11, monospace';
    const textWidth = ctx.measureText(text).width;
    const pad = 8;
    const w = Math.min(260, textWidth + pad * 2);
    const h = 24;
    const bx = Math.round(x - w / 2);
    const by = Math.round(y - h - 10);

    // Shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.fillRect(bx + 3, by + 3, w, h);

    // Bubble body
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.fillRect(bx, by, w, h);
    ctx.strokeRect(bx, by, w, h);

    // Tail
    ctx.beginPath();
    ctx.moveTo(x - 5, by + h);
    ctx.lineTo(x, by + h + 6);
    ctx.lineTo(x + 5, by + h);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.stroke();

    // Text
    ctx.fillStyle = '#111111';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, bx + pad, by + h / 2 + 1);
    ctx.restore();
  }
}

function resizeCanvas() {
  canvas.width = window.innerWidth;

function fitMapToScreen() {
  const scaleX = window.innerWidth / MAP_WIDTH;
  const scaleY = window.innerHeight / MAP_HEIGHT;
  camera.targetZoom = Math.min(scaleX, scaleY) * 0.95;
  camera.targetX = MAP_WIDTH / 2;

// 6. Interaction & Input Handling
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;
let cameraStartX = 0;
let cameraStartY = 0;

function screenToWorld(sx, sy) {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const wx = (sx - cx) / camera.zoom + camera.x;
  const wy = (sy - cy) / camera.zoom + camera.y;
  return { x: wx, y: wy };
}

// Mouse & Touch events
const container = document.getElementById('game-container');

container.addEventListener('pointerdown', (e) => {
  if (e.target.closest('header, .bottom-bar, #detail-drawer, #mobile-dpad')) return;
  isDragging = false;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  cameraStartX = camera.x;
  cameraStartY = camera.y;
});

container.addEventListener('pointermove', (e) => {
  if (dragStartX === 0 && dragStartY === 0) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  if (Math.hypot(dx, dy) > 8) {
    isDragging = true;
    camera.followBoss = false;
    camera.targetX = cameraStartX - dx / camera.zoom;
    camera.targetY = cameraStartY - dy / camera.zoom;
  }
});

container.addEventListener('pointerup', (e) => {
  if (e.target.closest('header, .bottom-bar, #detail-drawer, #mobile-dpad')) return;

  if (!isDragging) {
    const worldPos = screenToWorld(e.clientX, e.clientY);

    // Check if clicked an agent
    let clickedAgent = null;
    for (const id of ['pickle', 'muse', 'genspark', 'chatgpt']) {
      const ent = entities[id];
      const dist = Math.hypot(worldPos.x - ent.x, worldPos.y - (ent.y - 40));
      if (dist < 40) {
        clickedAgent = id;
        break;
      }
    }

    if (clickedAgent) {
      openDetailDrawer(clickedAgent);
      play8BitSound('click');
    } else {
      // Move Boss (Player)
      entities.boss.moveTo(worldPos.x, worldPos.y);
      clickTargetMarker = { x: worldPos.x, y: worldPos.y, timer: 0.6 };
      play8BitSound('click');
    }
  }

  dragStartX = 0;
  dragStartY = 0;
  isDragging = false;
});

// Wheel zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
  camera.targetZoom = Math.max(0.4, Math.min(2.5, camera.targetZoom * zoomFactor));
}, { passive: false });

function setupDpadButton(btnId, vx, vy) {
  const btn = document.getElementById(btnId);
  let interval = null;
  const start = () => {
    if (interval) return;
    interval = setInterval(() => {
      entities.boss.x += vx * 12;
      entities.boss.y += vy * 12;
      entities.boss.targetX = entities.boss.x;
      entities.boss.targetY = entities.boss.y;
      entities.boss.isMoving = true;
      entities.boss.facing = vx >= 0 ? 1 : -1;
      play8BitSound('step');
    }, 40);
  };
  const end = () => {
    clearInterval(interval);
    interval = null;
    entities.boss.isMoving = false;
  };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointercancel', end);
  btn.addEventListener('pointerleave', end);
}

// Proximity Interaction
let lastNearbyAgent = null;
function checkProximity() {
  const boss = entities.boss;
  let nearest = null;
  let minDist = 95;

  for (const id of ['pickle', 'muse', 'genspark', 'chatgpt']) {
    const ent = entities[id];
    const dist = Math.hypot(boss.x - ent.x, boss.y - ent.y);
    if (dist < minDist) {
      nearest = ent;
      minDist = dist;
    }
  }

  if (nearest && nearest !== lastNearbyAgent) {
    play8BitSound('chime');
    nearest.facing = boss.x >= nearest.x ? 1 : -1;
    const pool = AGENT_DATA[nearest.id].dialogues;
    nearest.say(pool[0], 4.0);
    lastNearbyAgent = nearest;
  } else if (!nearest) {
    lastNearbyAgent = null;
  }
}

function checkProximityInteraction() {
  if (lastNearbyAgent) {
    openDetailDrawer(lastNearbyAgent.id);
  }
}

// 9. Main Game Loop
let lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  // Keyboard movement for boss
  let kx = 0;
  let ky = 0;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) ky -= 1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) ky += 1;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) kx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) kx += 1;

  if (kx !== 0 || ky !== 0) {
    const mag = Math.hypot(kx, ky);
    entities.boss.x += (kx / mag) * entities.boss.speed * dt;
    entities.boss.y += (ky / mag) * entities.boss.speed * dt;
    entities.boss.targetX = entities.boss.x;
    entities.boss.targetY = entities.boss.y;
    entities.boss.isMoving = true;
    entities.boss.facing = kx !== 0 ? (kx > 0 ? 1 : -1) : entities.boss.facing;
    entities.boss.walkTimer += dt * 8;
    camera.followBoss = true;

    if (Math.sin(entities.boss.walkTimer * 2) > 0.95) {
      play8BitSound('step');
    }
  }

  // Update entities
  Object.values(entities).forEach(e => e.update(dt));
  checkProximity();

  // Smooth camera interpolation
  if (camera.followBoss) {
    camera.targetX = entities.boss.x;
    camera.targetY = entities.boss.y;
  }
  camera.x += (camera.targetX - camera.x) * 0.12;
  camera.y += (camera.targetY - camera.y) * 0.12;
  camera.zoom += (camera.targetZoom - camera.zoom) * 0.12;

  // Render Scene
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();

  // Camera transform (centered)
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);

  // 1. Draw Map Background
  if (mapImage.complete) {
    ctx.drawImage(mapImage, 0, 0, MAP_WIDTH, MAP_HEIGHT);
  }

  // 2. Draw Click Marker
  if (clickTargetMarker && clickTargetMarker.timer > 0) {
    clickTargetMarker.timer -= dt;
    const progress = 1 - (clickTargetMarker.timer / 0.6);
    ctx.strokeStyle = '#f1c40f';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(clickTargetMarker.x, clickTargetMarker.y, 8 + progress * 16, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 3. Draw Entities (Y-sorted for natural occlusion)
  const sortedEntities = Object.values(entities).sort((a, b) => a.y - b.y);
  sortedEntities.forEach(e => e.draw(ctx));

  ctx.restore();
  requestAnimationFrame(gameLoop);
}
