  #brand { display:flex; align-items:center; gap:12px; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
  #brand .t1 { font-size:21px; font-weight:900; letter-spacing:2.5px; }

  .sp { flex:1; }
  #segTag { background:rgba(255,207,92,.92); color:#4a3200; font-weight:800; font-size:14px;

  #timer { font-size:15px; font-weight:700; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.25);

  #hint { font-size:12px; opacity:.75; }

  /* 말풍선 (방송 자막형) */
  #bubble { position:absolute; left:50%; bottom:104px; transform:translate(-50%, 16px); z-index:25;
    max-width:min(620px, 62vw); background:#fff; color:#191919; border-radius:20px; padding:16px 22px 13px;
    box-shadow:0 18px 44px rgba(0,0,0,.45); opacity:0; transition:opacity .45s ease, transform .45s ease; pointer-events:none; }
  #bubble.on { opacity:1; transform:translate(-50%, 0); }
  #bubble::after { content:''; position:absolute; left:50%; bottom:-11px; transform:translateX(-50%);
    border:12px solid transparent; border-top-color:#fff; border-bottom:0; }
  #bubble .who { position:absolute; top:-13px; left:16px; color:#fff; font-size:12.5px; font-weight:800;
    padding:4px 11px; border-radius:999px; box-shadow:0 4px 10px rgba(0,0,0,.25); }
  #bubble .txt { font-size:19px; font-weight:700; line-height:1.45; min-height:26px; word-break:keep-all; }

  /* 플레이어 */
  #player { position:absolute; left:0; right:0; bottom:0; height:78px; z-index:30;
    display:flex; align-items:center; gap:16px; padding:0 22px;
    background:linear-gradient(0deg, rgba(10,6,24,.85), rgba(10,6,24,.45) 70%, rgba(10,6,24,0)); color:#fff; }
  .pbtn { width:46px; height:46px; border-radius:50%; border:0; cursor:pointer; font-size:19px;

  .pbtn.small { width:38px; height:38px; font-size:15px; background:rgba(255,255,255,.16); color:#fff; }
  #trackName { font-size:15px; font-weight:800; min-width:220px; }
  #progWrap { flex:1; height:6px; background:rgba(255,255,255,.22); border-radius:3px; overflow:hidden; }
  #prog { height:100%; width:0%; background:#ffd166; }
  #timeLabel { font-size:13px; font-variant-numeric:tabular-nums; opacity:.9; min-width:96px; text-align:right; }

  /* 시작 오버레이 */
  #overlay { position:absolute; inset:0; z-index:50; display:flex; flex-direction:column; gap:18px;

  const ow=$('office').contentWindow;
  const cur=(panelIdx-1)%PANELS.length;
  const first=PANELS.findIndex(q=>q.ep===p.ep);
  let last=first; PANELS.forEach((q,i)=>{ if(q.ep===p.ep) last=i; });
  const prog=Math.round((cur-first+1)/(last-first+1)*100);
  if(ow) ow.postMessage({type:'fm-panel', f:p.f, ep:p.ep, t:p.t, prog:prog}, '*');
}

/* 말풍선 */
const bubble=$('bubble'), bWho=$('bWho'), bTxt=$('bTxt');
let lineIdx=0, bubbleTimer=null, typeTimer=null, started=false;
function showLine(){
  if(!started) return;
  const [who,text]=SCRIPT[lineIdx%SCRIPT.length]; lineIdx++;
  const seg=$('segTag');
  if(who==='obs'){ bubble.classList.remove('on'); if(seg) seg.textContent='관찰 구간';
    bubbleTimer=setTimeout(()=>setTimeout(showLine,600), 11000); return; }
  if(seg) seg.textContent='스토리 구간';
  const a=AGENTS[who]; if(!a){ setTimeout(showLine,800); return; }
  bWho.textContent=a.name; bWho.style.background=a.color;
  bubble.classList.add('on'); bTxt.textContent='';
  const ow=$('office').contentWindow;
  if(ow){ const now=new Date();
    ow.postMessage({type:'fm-chat', who, name:a.name.replace('● ',''),
      time:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'), text}, '*'); }
  let i=0; clearInterval(typeTimer);
  typeTimer=setInterval(()=>{ bTxt.textContent=text.slice(0,++i); if(i>=text.length) clearInterval(typeTimer); }, 34);
  const dur = 3200 + text.length*62;
  bubbleTimer=setTimeout(()=>{ bubble.classList.remove('on'); setTimeout(showLine, 1300); }, dur);
}

/* 음악 플레이어 */
const audio=$('audio');
let trackIdx=0;
function fmt(s){ if(!isFinite(s)) s=0; s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function loadTrack(i){
  trackIdx=(i+TRACKS.length)%TRACKS.length;
  audio.src=TRACKS[trackIdx].src; $('trackName').textContent='♪ '+TRACKS[trackIdx].name;
}
audio.addEventListener('ended', ()=>{ loadTrack(trackIdx+1); audio.play(); });
audio.addEventListener('timeupdate', ()=>{
  if(audio.duration) $('prog').style.width=(audio.currentTime/audio.duration*100)+'%';
  $('timeLabel').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration);
});
$('playBtn').onclick=()=>{ if(audio.paused){ audio.play(); $('playBtn').textContent='⏸'; } else { audio.pause(); $('playBtn').textContent='▶'; } };
$('nextBtn').onclick=()=>{ loadTrack(trackIdx+1); if(started) audio.play(); $('playBtn').textContent='⏸'; };
$('prevBtn').onclick=()=>{ loadTrack(trackIdx-1); if(started) audio.play(); $('playBtn').textContent='⏸'; };

/* 타이머 */
let startAt=null;
setInterval(()=>{ if(!startAt) return;
  const s=Math.floor((Date.now()-startAt)/1000);
  $('timer').textContent=[s/3600, s/60%60, s%60].map(v=>String(Math.floor(v)).padStart(2,'0')).join(':');
}, 500);

/* 시작 */
addEventListener('message', e=>{ if(e.data && e.data.type==='fm-phase-now'){
  const pc=$('phaseChip'); if(pc) pc.textContent=e.data.label; } });
setTimeout(()=>{ const ow=$('office').contentWindow;
  if(ow && PANELS[0]){ const last0=PANELS.map(q=>q.ep).lastIndexOf(PANELS[0].ep); ow.postMessage({type:'fm-panel', f:PANELS[0].f, ep:PANELS[0].ep, t:PANELS[0].t, prog:Math.round(100/(last0+1))}, '*'); } }, 1500);
loadTrack(0);
$('startBtn').onclick=()=>{
  $('overlay').style.display='none'; started=true; startAt=Date.now();
  audio.play(); $('playBtn').textContent='⏸';
  showPanel(); setInterval(showPanel, 9500); showLine();
};
addEventListener('keydown', e=>{ if(e.key==='h'||e.key==='H') document.body.classList.toggle('ui-hidden'); });
</script>
</body>
